name: Release

# Publishes a GitHub release whenever the workspace version in Cargo.toml is
# bumped on main: the version job computes v<version>, skips if that release
# already exists, otherwise the matrix builds and the release job publishes.
# `gh release create` creates the tag itself, pointing at the triggering commit.
on:
  push:
    branches: [main]
    paths: [Cargo.toml, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      major: ${{ steps.v.outputs.major }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(awk -F'"' '/^\[workspace\.package\]/{s=1} s && /^version = /{print $2; exit}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "major=$(echo "$version" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::notice::release v$version already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [version, webui]
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux legs build inside cross's pinned containers: the runner
          # image is irrelevant and the artifact's glibc is deterministic
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            builder: cross
            heapprof: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            builder: cross
            heapprof: true
          - os: macos-latest
            target: aarch64-apple-darwin
            builder: cargo
            heapprof: true
          # jemalloc has no MSVC support; the feature is inert here
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            builder: cargo
            heapprof: false
    runs-on: ${{ matrix.os }}
    env:
      KMRS_OAUTH_ANILIST_CLIENT_ID: ${{ secrets.KMRS_OAUTH_ANILIST_CLIENT_ID }}
      KMRS_OAUTH_ANILIST_CLIENT_SECRET: ${{ secrets.KMRS_OAUTH_ANILIST_CLIENT_SECRET }}
      KMRS_OAUTH_MAL_CLIENT_ID: ${{ secrets.KMRS_OAUTH_MAL_CLIENT_ID }}
      KMRS_OAUTH_MAL_CLIENT_SECRET: ${{ secrets.KMRS_OAUTH_MAL_CLIENT_SECRET }}
      KMRS_OAUTH_BANGUMI_CLIENT_ID: ${{ secrets.KMRS_OAUTH_BANGUMI_CLIENT_ID }}
      KMRS_OAUTH_BANGUMI_CLIENT_SECRET: ${{ secrets.KMRS_OAUTH_BANGUMI_CLIENT_SECRET }}
      KMRS_OAUTH_MANGABAKA_CLIENT_ID: ${{ secrets.KMRS_OAUTH_MANGABAKA_CLIENT_ID }}
      KMRS_OAUTH_MANGABAKA_CLIENT_SECRET: ${{ secrets.KMRS_OAUTH_MANGABAKA_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      # the bundle is embedded into the binary at compile time
      - uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: webui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # registry downloads only; compile caching is sccache's job
          cache-targets: "false"
      - uses: taiki-e/install-action@v2
        if: matrix.builder == 'cross'
        with:
          tool: cross
      - uses: mozilla-actions/sccache-action@v0.0.11
        if: matrix.builder == 'cargo'
      - name: Build (cross)
        if: matrix.builder == 'cross'
        run: cross build --release --target ${{ matrix.target }} -p komga-server --features profiling
        env:
          # hermetic liblzma regardless of image contents
          LZMA_API_STATIC: "1"
          # keep the symbol table: heap dumps taken from the shipped binary are
          # symbolized against it (jeprof needs function names)
          CARGO_PROFILE_RELEASE_STRIP: "debuginfo"
      - name: Build (cargo)
        if: matrix.builder == 'cargo'
        run: cargo build --release --target ${{ matrix.target }} -p komga-server ${{ matrix.heapprof && '--features profiling' || '' }}
        env:
          LZMA_API_STATIC: "1"
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_STRIP: ${{ matrix.heapprof && 'debuginfo' || 'symbols' }}
      - name: Install macOS packaging tools
        if: matrix.os == 'macos-latest'
        run: brew install librsvg
      - name: Check macOS signing secrets
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              printf 'Missing release secret: %s\n' "$name" >&2
              exit 1
            fi
          done
      - name: Import macOS signing certificate
        if: matrix.os == 'macos-latest'
        id: codesign
        uses: apple-actions/import-codesign-certs@v7
        with:
          keychain: kmrs-signing
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Package KMServer.app (macOS)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SIGNING_KEYCHAIN: kmrs-signing.keychain
          SIGNING_IDENTITIES: ${{ steps.codesign.outputs.identities }}
        run: |
          packaging/macos/package.sh \
            "target/${{ matrix.target }}/release/kmrs" \
            "${{ needs.version.outputs.version }}" \
            dist \
            aarch64
          ditto -c -k --keepParent dist/KMServer.app dist/KMServer.zip
      - name: Package (unix)
        if: matrix.os != 'windows-latest' && matrix.os != 'macos-latest'
        shell: bash
        run: |
          stage="kmrs_${{ needs.version.outputs.version }}_${{ matrix.target }}"
          mkdir -p "$stage" dist
          cp "target/${{ matrix.target }}/release/kmrs" "$stage/"
          cp LICENSE NOTICE README.md "$stage/"
          cp -R licenses "$stage/"
          tar -czf "dist/${stage}.tar.gz" "$stage"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "kmrs_${{ needs.version.outputs.version }}_${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage, dist, pdfium | Out-Null
          curl.exe -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8125/pdfium-win-x64.tgz" -o pdfium.tgz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar.exe -xzf pdfium.tgz -C pdfium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "target\${{ matrix.target }}\release\kmrs.exe" $stage
          Copy-Item pdfium\bin\pdfium.dll $stage
          Copy-Item LICENSE, NOTICE, README.md $stage
          Copy-Item -Recurse licenses $stage
          Copy-Item pdfium\LICENSE "$stage\licenses\PDFium-LICENSE"
          Copy-Item -Recurse pdfium\licenses "$stage\licenses\PDFium"
          Compress-Archive -Path $stage -DestinationPath "dist\${stage}.zip"
          Copy-Item "target\${{ matrix.target }}\release\kmrs.exe" packaging/windows/kmrs.exe
          Copy-Item pdfium\bin\pdfium.dll packaging/windows/pdfium.dll
          New-Item -ItemType Directory -Path packaging/windows/PDFium | Out-Null
          Copy-Item pdfium\LICENSE packaging/windows/PDFium/
          Copy-Item -Recurse pdfium\licenses packaging/windows/PDFium/
          Copy-Item crates/komga-server/resources/windows/kmrs.ico packaging/windows/kmrs.ico
          choco install nsis --no-progress -y
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis" }
          & $makensis /DVERSION=${{ needs.version.outputs.version }} /DOUTFILE="$PWD\dist\KMServer_x64-setup.exe" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item packaging\windows\kmrs.exe, packaging\windows\kmrs.ico, packaging\windows\pdfium.dll
          Remove-Item -Recurse packaging\windows\PDFium, pdfium
          Remove-Item pdfium.tgz
      - name: Write update checksums
        if: matrix.os == 'macos-latest' || matrix.os == 'windows-latest'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = macos-latest ]; then
            assets=(KMServer.zip)
          else
            assets=(KMServer_x64-setup.exe)
          fi
          for asset in "${assets[@]}"; do
            sha256sum "dist/$asset"
          done > dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: kmrs-${{ matrix.target }}
          path: dist/*

  webui:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-webui
      - uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: webui/dist

  docker:
    needs: [version, build]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-unknown-linux-gnu"
          path: artifacts
      - name: Stage binaries
        run: |
          mkdir -p dist/amd64 dist/arm64
          tar -xzf artifacts/kmrs-x86_64-unknown-linux-gnu/*.tar.gz -C dist/amd64 --strip-components=1 --wildcards '*/kmrs'
          tar -xzf artifacts/kmrs-aarch64-unknown-linux-gnu/*.tar.gz -C dist/arm64 --strip-components=1 --wildcards '*/kmrs'
          ls -l dist/amd64 dist/arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: everpcpc
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
            everpcpc/kmrs
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.major }}.x
      - name: Smoke test (amd64)
        # the shipped artifact gets no other runtime validation; a glibc or
        # packaging regression must fail here, before anything is pushed
        run: |
          trap 'docker logs kmrs' ERR
          docker buildx build --platform linux/amd64 --load -t kmrs:smoke .
          docker run -d --name kmrs --user 1000:1000 -p 25600:25600 kmrs:smoke
          for i in $(seq 1 30); do
            curl -sf http://localhost:25600/actuator/health > /dev/null && break || sleep 2
          done
          # the bundled web UI is served at /
          curl -sf http://localhost:25600/ | grep -q "<title>KMReader</title>"
          # the API is up and the database answers: claim status on a fresh install
          curl -sf http://localhost:25600/api/v1/claim | grep -q '"isClaimed":false'
          echo "server is up: web UI and API verified"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          # the build record artifact would otherwise be swept into the release assets
          DOCKER_BUILD_RECORD_UPLOAD: "false"

  release:
    # after docker: if the image smoke test fails, no release is created, so
    # the skip-guard does not block a fixed re-run
    needs: [version, build, docker]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          # only the binaries uploaded by the build job; anything else (e.g.
          # docker build records) never reaches the release assets
          pattern: "kmrs-*"
          merge-multiple: true
          path: artifacts
      - run: gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA" artifacts/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
